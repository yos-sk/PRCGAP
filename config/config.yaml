    mem_mb: 128000
  copynumber:
    threads: 8
    mem_mb: 48000
  copynumber_reference:
    threads: 1
    mem_mb: 8000
  copynumber_ref_table:
    threads: 8
    mem_mb: 48000
  copynumber_ref_table_final:
    threads: 1
    mem_mb: 8000
  copynumber_depth:
    threads: 4
    mem_mb: 16000
  copynumber_segment:
    threads: 1
    mem_mb: 8000
  copynumber_plot:
    threads: 1
    mem_mb: 8000
  nanomonsv_parse:
    threads: 16
    mem_mb: 128000
  nanomonsv_get:
    threads: 16
    mem_mb: 240000
  nanomonsv_postprocess:
    threads: 1
    mem_mb: 30000
  nanomonsv_insert_classify:
    threads: 16
    mem_mb: 128000
  nanomonsv_connect:
    threads: 1
    mem_mb: 30000
  nanomonsv_merge:
    threads: 1
    mem_mb: 30000
  clairs:
    threads: 16
    mem_mb: 128000
  deepsomatic:
    threads: 16
    mem_mb: 128000
  clairs_postprocess:
    threads: 1
    mem_mb: 32000
  clairs_postprocess_split:
    threads: 1
    mem_mb: 32000
  clairs_postprocess_realign:
    threads: 16
    mem_mb: 128000
  clairs_postprocess_pileup:
    threads: 6
    mem_mb: 240000
  clairs_postprocess_haplotype:
    threads: 4
    mem_mb: 64000
  deepsomatic_postprocess:
    threads: 1
    mem_mb: 32000
  deepsomatic_postprocess_split:
    threads: 1
    mem_mb: 32000
  deepsomatic_postprocess_realign:
    threads: 16
    mem_mb: 128000
  deepsomatic_postprocess_pileup:
    threads: 6
    mem_mb: 240000
  deepsomatic_postprocess_haplotype:
