# ====================================================================
# PRCGAP workflow configuration template
# --------------------------------------------------------------------
# Copy this file (e.g. to config/my_config.yaml) and fill in the
# paths for your run. Alternatively, generate a populated config via:
#
#   python setup_workflow.py --samplesheet <tsv> --chm13-fasta <fa> ...
#
# Required keys: samplesheet, chm13_fasta, singularity_images.
# All other path values may be left as "" to skip the corresponding
# annotation / liftover step.
# ====================================================================

# ---- core I/O ----
output_dir: ""
samplesheet: ""
chm13_fasta: ""

# ---- singularity images (one .sif per tool) ----
singularity_images:
  bam_refiner: ""
  methylation: ""
  copynumber: ""
  nanomonsv: ""
  nanomonsv_postprocess: ""
  clairs: ""
  deepsomatic: ""
  point_mutation_postprocess: ""
  annotation: ""
  dna_nn: ""                # only needed when run_dna_brnn: true
  liftoff: ""               # only needed when run_liftoff: true
  chain_files: ""           # only needed when run_chain_files: true

# ---- per-rule resources (threads / mem_mb) ----
# Numeric defaults shown below. Override per-rule as needed.
resources:
  dna_brnn:
    threads: 8
    mem_mb: 8000
  liftoff_reference:
    threads: 1
    mem_mb: 8000
  liftoff:
    threads: 8
    mem_mb: 128000
  liftoff_merge:
    threads: 1
    mem_mb: 16000
  prepare_mask_regions:
    threads: 1
    mem_mb: 10240
  make_chain_files:
    threads: 8
    mem_mb: 48000
  chain_files_merge:
    threads: 1
    mem_mb: 8000
  line1:
    threads: 8
    mem_mb: 16000
  line1_merge:
    threads: 1
    mem_mb: 8000
  simple_repeat:
    threads: 8
    mem_mb: 32000
  simple_repeat_merge:
    threads: 1
    mem_mb: 8000
  bam_refiner_kmer:
    threads: 8
    mem_mb: 32000
  bam_refiner:
    threads: 8
    mem_mb: 64000
  assembly_bwa_index:
    threads: 1
    mem_mb: 16000
  methylation:
    threads: 8
    mem_mb: 32000
  # copynumber is split per haplotype; the granular keys below fall back to
  # this one when unset.
  copynumber:
    threads: 8
    mem_mb: 48000
  copynumber_reference:
    threads: 1
    mem_mb: 4000
  copynumber_ref_table:
    threads: 8
    mem_mb: 48000
  copynumber_ref_table_final:
    threads: 1
    mem_mb: 8000
  copynumber_depth:
    threads: 4
    mem_mb: 8000
  copynumber_segment:
    threads: 1
    mem_mb: 4000
  copynumber_plot:
    threads: 1
    mem_mb: 4000
  nanomonsv_parse:
    threads: 8
    mem_mb: 16000
  nanomonsv_get:
    threads: 8
    mem_mb: 64000
  nanomonsv_postprocess:
    threads: 1
    mem_mb: 8000
  nanomonsv_insert_classify:
    threads: 8
    mem_mb: 64000
  nanomonsv_connect:
    threads: 1
    mem_mb: 30000
  nanomonsv_merge:
    threads: 1
    mem_mb: 30000
  # clairs / deepsomatic are per-CHUNK: the callers are scattered over contigs.
  clairs:
    threads: 8
    mem_mb: 32000
  clairs_scatter_setup:
    threads: 8
    mem_mb: 16000
  clairs_chunks:
    threads: 1
    mem_mb: 4000
  clairs_merge:
    threads: 1
    mem_mb: 16000
  deepsomatic:
    threads: 8
    mem_mb: 32000
  deepsomatic_scatter_setup:
    threads: 8
    mem_mb: 16000
  deepsomatic_chunks:
    threads: 1
    mem_mb: 4000
  deepsomatic_merge:
    threads: 1
    mem_mb: 16000
  clairs_postprocess:
    threads: 1
    mem_mb: 32000
  clairs_postprocess_split:
    threads: 1
    mem_mb: 32000
  clairs_postprocess_realign:
    threads: 8
    mem_mb: 16000
  clairs_postprocess_pileup:
    threads: 8
    mem_mb: 32000
  clairs_postprocess_haplotype:
    threads: 4
    mem_mb: 64000
  deepsomatic_postprocess:
    threads: 1
    mem_mb: 32000
  deepsomatic_postprocess_split:
    threads: 1
    mem_mb: 32000
  deepsomatic_postprocess_realign:
    threads: 8
    mem_mb: 16000
  deepsomatic_postprocess_pileup:
    threads: 8
    mem_mb: 32000
  deepsomatic_postprocess_haplotype:
    threads: 4
    mem_mb: 64000
  prep_sv:
    threads: 1
    mem_mb: 8000
  coordconv_sv:
    threads: 1
    mem_mb: 8000
  annotate_sv:
    threads: 1
    mem_mb: 16000
  reclassify_sv:
    threads: 1
    mem_mb: 16000
  prep_mut:
    threads: 1
    mem_mb: 8000
  coordconv_mut:
    threads: 1
    mem_mb: 8000
  annotate_mut:
    threads: 1
    mem_mb: 16000

# ---- sample-level params ----
hap1_satellite: ""
hap2_satellite: ""
sex: female            # one of: "female" | "male"
simple_repeat: ""      # superseded when run_simple_repeat: true
gtf_file: ""           # liftoff GTF for nanomonsv insert_classify
line1_bed: ""          # superseded when run_line1: true
simple_repeat_min_copies: 4   # min repeat copies to keep when run_simple_repeat: true

# ---- copy number plot params ----
copynumber_binwidth: 0.05        # bin width for the depth-ratio mode/ploidy estimate
copynumber_hap1_label: Haplotype1
copynumber_hap2_label: Haplotype2
copynumber_ploidy_hap1: ""       # leave "" to auto-estimate tumor ploidy; set an integer to override
copynumber_ploidy_hap2: ""
copynumber_plot_sex_chrom: true  # force chrX/chrY onto the plot even if absent (false = only when present)
chm13_censat: ""                 # CHM13 cenSat v2.1 BED(.gz): fill assembly gaps in the plot (optional)
# CHM13 chr lengths for the plot's terminal margin are derived at plot time from
# chm13_fasta via chromosome_length.py (no separate file needed).
# ---- point-mutation caller ----
mutation_caller: deepsomatic     # deepsomatic (default) | clairs | both
# Callers are scattered over contigs; contigs are never split. A contig at least
# this long gets a job of its own; all shorter ones share one job. 0 = strictly
# one job per contig.
caller_solo_contig_min_bp: 1000000
# postprocess_variants' worker count. Its own default is the node's core count
# and ignores --num_shards / the scheduler allocation.
deepsomatic_postprocess_variants_cpus: 1

pileup_no_baq: 'true'            # --no-BAQ in the pileup step (cuts peak RSS ~26x; 'false' = keep BAQ)
pileup_max_depth: 0              # samtools mpileup -d (0 = samtools default 8000)
pileup_num_chunks: 16           # target max pileup chunks (contigs packed into balanced, -r-seekable chunks)

# ---- optional nanomonsv steps (not used in the paper) ----
run_nanomonsv_connect: false     # nanomonsv connect
run_nanomonsv_merge: false       # combine HiFi+ONT results (only runs when both seqtypes are present)

# ---- in-workflow annotation (opt-in per step) ----
# Turn a switch on and PRCGAP builds that annotation from the assembly plus the
# CHM13/GRCh38 references, instead of importing it from assembly_workflow. The
# generated file then supersedes the corresponding path key below, which can be
# left "".
run_dna_brnn: true             # → hap1_satellite / hap2_satellite
                               #   only consumer is the copy-number plot's cen/sat
                               #   track, so setting censat_bed turns this off
                               #   regardless (69 min per haplotype)
run_liftoff: false             # → gff_file / gtf_file      (needs grch38_fasta, grch38_gtf)
                               #   opt-in: heaviest step (8 threads x 128 GB per hap)
run_line1: true                # → line1_bed      (no extra reference needed)
                               #   full-length young L1 for nanomonsv insert_classify
run_simple_repeat: true        # → simple_repeat  (no extra reference needed)
                               #   ULTRA period<=10, for nanomonsv get indel filtering
run_chain_files: true          # → chain_to_chm13 / chain_to_grch38
                               #   (needs chm13_fasta, grch38_fasta, chm13_censat,
                               #    grch38_centromeres, grch38_exclusions)

# Reference inputs for the steps above; see download_reference.sh.
grch38_gtf: ""                 # GRCh38 GTF with chr* contig names (plain .gtf)
grch38_centromeres: ""         # UCSC hg38 centromeres.txt(.gz)
grch38_exclusions: ""          # GRC exclusion regions BED

# ---- annotation resources (set to "" to skip the corresponding step) ----
gff_file: ""                   # tabix-indexed liftoff GFF for SV/SNV/INDEL gene annotation
chain_to_grch38: ""
chain_to_chm13: ""
repeat_masker_bed: ""
segdup_bed: ""
censat_bed: ""
misassembly_hap1_bed: ""
misassembly_hap2_bed: ""
cancer_gene_census_tsv: ""
cmrg_gene_tsv: ""
gencode_transcript_bed: ""
gnomad_bed: ""
gnomad_vcf: ""
grch38_fasta: ""
