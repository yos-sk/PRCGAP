# ---- sample-level params ----
hap1_satellite: ""
hap2_satellite: ""
sex: female            # one of: "female" | "male"
simple_repeat: ""
gtf_file: ""           # liftoff GTF for nanomonsv insert_classify
line1_bed: ""

# ---- copy number plot params ----
copynumber_binwidth: 0.05        # bin width for the depth-ratio mode/ploidy estimate
copynumber_hap1_label: Haplotype1
copynumber_hap2_label: Haplotype2
copynumber_ploidy_hap1: ""       # leave "" to auto-estimate tumor ploidy; set an integer to override
copynumber_ploidy_hap2: ""
copynumber_plot_sex_chrom: true  # force chrX/chrY onto the plot even if absent (false = only when present)
chm13_censat: ""                 # CHM13 cenSat v2.1 BED(.gz): fill assembly gaps in the plot (optional)
# CHM13 chr lengths for the plot's terminal margin are derived at plot time from
# chm13_fasta via chromosome_length.py (no separate file needed).
pileup_no_baq: false             # true = --no-BAQ in the pileup step (setup_workflow.py --pileup-no-baq)

deepsomatic_postprocess_variants_cpus: 1   # postprocess_variants workers (its default = host core count)

# ---- optional point-mutation caller ----
run_clairs: false                # true = also run ClairS alongside DeepSomatic (setup_workflow.py --run-clairs)
# Which sequencing types the point-mutation callers (DeepSomatic / ClairS) run on
# (setup_workflow.py --mutation-seqtypes):
#   primary  one seqtype only, HiFi when both are present (default)
#   hifi     HiFi only        ont   ONT only
#   all      every seqtype available for both tumor and normal
# SV (nanomonsv) and methylation always use every available seqtype.
mutation_seqtypes: primary
# ClairS --platform per seqtype; required for each seqtype ClairS runs on
# (no default: pick the one matching your data).
#   HiFi: hifi_sequel2 | hifi_revio
#   ONT : ont_r10_dorado_sup_5khz_ssrs | ont_r10_dorado_sup_5khz_ss | ont_r10_dorado_sup_4khz
#         ont_r10_dorado_hac_5khz | ont_r10_dorado_hac_4khz | ont_r10_guppy | ont_r9_guppy (R9.4.1)
clairs_platform_hifi: ""
clairs_platform_ont: ""

# ---- annotation resources (set to "" to skip the corresponding step) ----
gff_file: ""                   # tabix-indexed liftoff GFF for SV/SNV/INDEL gene annotation
chain_to_grch38: ""
chain_to_chm13: ""
repeat_masker_bed: ""
segdup_bed: ""
censat_bed: ""
misassembly_hap1_bed: ""
misassembly_hap2_bed: ""
cancer_gene_census_tsv: ""
cmrg_gene_tsv: ""
gencode_transcript_bed: ""
gnomad_bed: ""
gnomad_vcf: ""
grch38_fasta: ""
