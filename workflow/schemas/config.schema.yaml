$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for the workflow
properties:
  output_dir:
    type: string
    description: output directory path (used with snakemake --directory)

  samplesheet:
    type: string
    description: path to sample-sheet TSV file

  chm13_fasta:
    type: string
    description: |
      path to the CHM13 reference genome FASTA. Used by `copynumber.smk`
      and by the INDEL `liftvcf_indel_chm13` rule (transanno `--query`).

  singularity_images:
    type: object
    properties:
      bam_refiner:
        type: string
        description: path to singularity image of bam_refiner
      methylation:
        type: string
        description: path to singularity image of tools for methylation calling
      copynumber:
        type: string
        description: path to singularity image of tools for copy number calling
      nanomonsv:
        type: string
        description: path to singularity image of tools for SV calling (parse, get, insert_classify, connect, merge)
      nanomonsv_postprocess:
        type: string
        description: path to singularity image of NanoMonSV postprocessing
      clairs:
        type: string
        description: path to singularity image of ClairS variant caller
      deepsomatic:
        type: string
        description: path to singularity image of DeepSomatic variant caller
      point_mutation_postprocess:
        type: string
        description: path to singularity image of tools for point mutation postprocessing
      annotation:
        type: string
        description: |
          path to singularity image bundling all annotation tooling
          (pysam, samtools, coordconv, transanno). Used by every rule
          under workflow/rules/annotate_sv.smk and annotate_mut.smk.
      dna_nn:
        type: string
        description: |
          path to singularity image providing dna-brnn (+ bgzip/tabix).
          Only needed when run_dna_brnn is true.
      liftoff:
        type: string
        description: |
          path to singularity image providing liftoff, minimap2 and gffread.
          Only needed when run_liftoff is true.
      chain_files:
        type: string
        description: |
          path to singularity image providing minimap2, transanno, chaintools,
          rustybam, paf2chain, bedtools and samtools. Only needed when
          run_chain_files is true.

  resources:
    type: object
    description: resource configuration for each tool (threads and mem_mb)
    additionalProperties:
      type: object
      properties:
        threads:
          type: number
          description: number of threads for this tool
        mem_mb:
          type: number
          description: memory per job in MB for this tool
    properties:
      dna_brnn:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      liftoff:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 128000)
      prepare_mask_regions:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 1)
          mem_mb:
            type: number
            description: memory per job in MB (default 10240)
      make_chain_files:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 128000)
      bam_refiner_kmer:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 8)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      bam_refiner:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 64000)
      assembly_bwa_index:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 1)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      methylation:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 8)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      copynumber:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 8)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      nanomonsv_parse:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      nanomonsv_get:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 8)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      nanomonsv_postprocess:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      nanomonsv_insert_classify:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      nanomonsv_connect:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      nanomonsv_merge:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 2)
          mem_mb:
            type: number
            description: memory per job in MB (default 8000)
      clairs:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 64000)
      deepsomatic:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 64000)
      clairs_postprocess:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      clairs_postprocess_split:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 1)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      clairs_postprocess_realign:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 128000)
      clairs_postprocess_pileup:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000; --no-BAQ + -r drops peak RSS well below this)
      clairs_postprocess_haplotype:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 64000)
      deepsomatic_postprocess:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 16000)
      deepsomatic_postprocess_split:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 1)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000)
      deepsomatic_postprocess_realign:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 128000)
      deepsomatic_postprocess_pileup:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 16)
          mem_mb:
            type: number
            description: memory per job in MB (default 32000; --no-BAQ + -r drops peak RSS well below this)
      deepsomatic_postprocess_haplotype:
        type: object
        properties:
          threads:
            type: number
            description: number of threads (default 4)
          mem_mb:
            type: number
            description: memory per job in MB (default 64000)

  hap1_satellite:
    type: string
    description: path to satellite regions for haplotype 1

  hap2_satellite:
    type: string
    description: path to satellite regions for haplotype 2

  copynumber_binwidth:
    type: number
    description: bin width for the depth-ratio mode/ploidy estimate (default 0.05)

  copynumber_hap1_label:
    type: string
    description: haplotype 1 label on the copy number plot (default Haplotype1)

  copynumber_hap2_label:
    type: string
    description: haplotype 2 label on the copy number plot (default Haplotype2)

  copynumber_ploidy_hap1:
    type: ["string", "integer"]
    description: manual hap1 tumor ploidy override; empty string to auto-estimate

  copynumber_ploidy_hap2:
    type: ["string", "integer"]
    description: manual hap2 tumor ploidy override; empty string to auto-estimate

  copynumber_plot_sex_chrom:
    type: ["boolean", "string"]
    description: force chrX/chrY onto the copy-number plot even when absent from the data (true/false)

  chm13_censat:
    type: string
    description: CHM13 cenSat v2.1 BED (.gz) for the copy-number plot gap-fill (optional; empty to skip)

  sex:
    type: string
    description: sex of the sample (female or male)
    enum: ["female", "male"]

  run_nanomonsv_connect:
    type: boolean
    description: |
      run the optional nanomonsv `connect` step (not used in the paper;
      default false).
  run_nanomonsv_merge:
    type: boolean
    description: |
      run the optional nanomonsv `merge` step that combines the HiFi and ONT
      results (not used in the paper; default false; only runs when both
      seqtypes are present).

  mutation_caller:
    type: string
    description: |
      point-mutation caller to run (default deepsomatic). "both" restores the
      previous behaviour of running ClairS and DeepSomatic together.
    enum: ["deepsomatic", "clairs", "both"]

  debug:
    type: boolean
    description: |
      keep the scratch a successful run would otherwise delete (every
      workspace/, the caller scatter dirs, bwa_index/, the staged copy-number
      reference, and the nanomonsv/realign side products). Default false.

  caller_solo_contig_min_bp:
    type: integer
    minimum: 0
    description: |
      ClairS/DeepSomatic are scattered over contigs and a contig is never split.
      A contig at least this long gets a job of its own; all shorter contigs
      share a single job (default 1000000). 0 means strictly one job per contig.

  deepsomatic_postprocess_variants_cpus:
    type: integer
    minimum: 0
    description: |
      worker count passed to DeepSomatic's postprocess_variants via
      --postprocess_variants_extra_args (default 1). Its own default is the
      node's online core count and it ignores both --num_shards and the
      scheduler allocation, so leaving it unset forks one worker per physical
      core. 0 disables postprocess parallelism entirely.

  clairs_model:
    type: string
    description: |
      ClairS platform model (applies to every seqtype that ClairS runs on).
      Default hifi_sequel2. Pick the value matching your data: hifi_sequel2 or
      hifi_revio for HiFi; ont_r10_dorado_sup_5khz_ssrs or
      ont_r10_dorado_sup_4khz for ONT.
    enum:
      - hifi_sequel2
      - hifi_revio
      - ont_r10_dorado_sup_5khz_ssrs
      - ont_r10_dorado_sup_4khz

  pileup_no_baq:
    type: ["boolean", "string"]
    description: |
      pass --no-BAQ to samtools mpileup in the clairs/deepsomatic pileup step
      (default true). Disabling BAQ cuts peak RSS of the pileup step ~26x for
      long-read / high-depth data and keeps the read-base column format
      (ref-relative `.,`) unchanged.

  pileup_max_depth:
    type: number
    description: |
      value for samtools mpileup -d/--max-depth in the pileup step. 0 (default)
      uses the samtools default (8000). Set >0 to cap per-file depth in very
      high-depth regions (a runtime lever; memory is already small once BAQ is
      disabled).

  pileup_num_chunks:
    type: number
    description: |
      target maximum number of pileup chunks produced by split_bed.sh
      (default 16). Contigs are packed into balanced chunks; each chunk is
      pileup'd with `samtools mpileup -r` (index seek) instead of a full-BAM
      scan.

  simple_repeat:
    type: string
    description: path to simple repeat regions file

  gtf_file:
    type: string
    description: |
      path to GTF annotation file. Consumed by nanomonsv `insert_classify.py`
      (which only accepts `.gtf` / `.gtf.gz`). For SV / SNV / INDEL gene
      annotation use `gff_file` instead.
  gff_file:
    type: string
    description: |
      path to tabix-indexed liftoff GFF (.gff.gz + .tbi). Consumed by
      `annotate_sv` and `annotate_mut` for gene annotation. Must already be
      bgzipped and tabix-indexed (`tabix -p gff`).

  line1_bed:
    type: string
    description: path to LINE1 element BED file

  # ---- annotation resources (all optional; leave empty to skip the step) ----
  chain_to_grch38:
    type: string
    description: chain file from personalized assembly to GRCh38 (SV liftover flag)
  chain_to_chm13:
    type: string
    description: chain file from personalized assembly to CHM13 (SV liftover flag)
  repeat_masker_bed:
    type: string
    description: tabix-indexed RepeatMasker BED file
  segdup_bed:
    type: string
    description: tabix-indexed segmental duplication BED file
  censat_bed:
    type: string
    description: tabix-indexed centromere/satellite BED file
  misassembly_hap1_bed:
    type: string
    description: hap1 misassembly BED file (optional)
  misassembly_hap2_bed:
    type: string
    description: hap2 misassembly BED file (optional)
  cancer_gene_census_tsv:
    type: string
    description: Cancer Gene Census TSV file
  cmrg_gene_tsv:
    type: string
    description: CMRG gene list TSV (SNV/INDEL gene annotation)
  gencode_transcript_bed:
    type: string
    description: GENCODE transcript BED.gz (SNV/INDEL gene annotation)
  gnomad_bed:
    type: string
    description: gnomAD SV BED.gz (optional SV annotation; requires chain_to_grch38)
  gnomad_vcf:
    type: string
    description: gnomAD SNV/INDEL VCF.gz tabix-indexed (optional SNV/INDEL annotation; requires chain_to_grch38)
  grch38_fasta:
    type: string
    description: |
      GRCh38 reference FASTA. Used as transanno `--query` for INDEL liftover,
      and as the liftoff / chain-file source when run_liftoff or
      run_chain_files is enabled.

  # ---- in-workflow annotation (opt-in per step) ----
  # When a switch is on, PRCGAP builds that annotation from the assembly and the
  # references, and the generated path takes precedence over the corresponding
  # config key (hap{1,2}_satellite / gff_file+gtf_file / chain_to_*), which may
  # then be left empty.
  run_dna_brnn:
    type: boolean
    description: |
      build the per-haplotype dna-brnn satellite BEDs (supersedes
      hap1_satellite / hap2_satellite). Default true.
  run_liftoff:
    type: boolean
    description: |
      build the liftoff gene GFF + GTF (supersedes gff_file / gtf_file).
      Requires grch38_fasta and grch38_gtf. Default false — this is the
      heaviest annotation step (16 threads x 128 GB per haplotype), so it is
      opt-in; leave it off to supply gff_file / gtf_file instead.
  run_line1:
    type: boolean
    description: |
      build the full-length young LINE-1 BED (L1HS / L1PA2-L1PA5) that
      nanomonsv insert_classify uses as its transduction source list
      (supersedes line1_bed). Needs no extra reference: the L1.3 query and the
      Dfam subunit models are built into resource/line1 by resource/scripts/build_line1_resources.sh. Default true.
  run_simple_repeat:
    type: boolean
    description: |
      build the tandem repeat BED (ULTRA, period <= 10) that nanomonsv get uses
      to drop indel-like SVs inside a repeat (supersedes simple_repeat).
      Default true.
  simple_repeat_min_copies:
    type: integer
    description: |
      minimum repeat copy number to keep when run_simple_repeat is true.
      Default 4.
  run_chain_files:
    type: boolean
    description: |
      build the assembly → CHM13/GRCh38 chain files (supersedes
      chain_to_chm13 / chain_to_grch38). Requires chm13_fasta, grch38_fasta,
      chm13_censat, grch38_centromeres and grch38_exclusions. Default true.

  grch38_gtf:
    type: string
    description: |
      GRCh38 GTF with chr* contig names (plain .gtf), lifted onto the assembly
      by the liftoff rule. Required when run_liftoff is true.
  grch38_centromeres:
    type: string
    description: |
      UCSC hg38 centromeres table (centromeres.txt/.gz), masked out before
      chain-file alignment. Required when run_chain_files is true.
  grch38_exclusions:
    type: string
    description: |
      GRC exclusion-regions BED (false duplications etc.), masked out before
      chain-file alignment. Required when run_chain_files is true.

required:
  - samplesheet
  - chm13_fasta
  - singularity_images
